<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        html, body {
            margin: 0;
            height: 100%;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <pre id="out"></pre>
    <script>
        const myout = document.getElementById('out');

        var Module = {
            print: function (text) {
                myout.textContent += text + "\n";
            },
            printErr: function (text) {
                console.error("Module.printErr:", text);
            }
        };
    </script>

    <script>
        // Belangrijk: Module.canvas moet bestaan vóórdat minimal.js geladen wordt
        var Module = {
            canvas: (function () {
                return document.getElementById('canvas');
            })()
        };
    </script>

    {{{ SCRIPT }}}
</body>
</html>
