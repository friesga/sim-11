<!doctype html>
<html lang="nl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SDL + xterm</title>

    <link rel="stylesheet" href="./xterm/xterm.css" />

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #111;
            color: #ddd;
            overflow: hidden;
            font-family: sans-serif;
        }

        #layout {
            display: flex;
            width: 100%;
            height: 100%;
            gap: 12px;
            box-sizing: border-box;
            padding: 12px;
        }

        #canvas-pane {
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            background: #222;
            border: 1px solid #444;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: black;
        }

        #terminal-pane {
            flex: 0 0 auto;
            background: #111;
            border: 1px solid #444;
            padding: 8px;
            box-sizing: border-box;
            /* Ruim genoeg voor 80x24 bij fontSize 16.
         Eventueel later fijn afstellen. */
            width: 760px;
            height: 430px;
            overflow: hidden;
        }

        #terminal {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="layout">
        <div id="canvas-pane">
            <canvas id="canvas"></canvas>
        </div>

        <div id="terminal-pane">
            <div id="terminal"></div>
        </div>
    </div>

    <script>
    window.Module = {
            canvas: (function () {
                return document.getElementById('canvas');
            })(),

            print: function (text) {
                if (window.term) {
                    window.term.write(String(text) + "\r\n");
                } else {
                    console.log(text);
                }
            },

            printErr: function (text) {
                console.error(text);
            },

            onRuntimeInitialized: function () {
                window.runtimeReady = true;
                if (window.attachXtermInput) {
                    window.attachXtermInput();
                }
            }
        };</script>

    <!-- <script src="./sim-11.js"></script> -->
    <script src="./xterm/xterm.js"></script>

    <script>
    const term = new Terminal({
            cols: 80,
            rows: 24,
            cursorBlink: true,
            convertEol: true,
            fontSize: 16
        });

        term.open(document.getElementById("terminal"));
        window.term = term;

        let inputAttached = false;

        window.attachXtermInput = function () {
            if (inputAttached) return;
            if (!window.term) return;
            if (!window.Module || !window.Module._on_xterm_char) return;

            inputAttached = true;
            term.focus();

            term.onData(function (data) {
                for (const ch of data) {
                    window.Module._on_xterm_char(ch.charCodeAt(0));
                }
            });
        };

        if (window.runtimeReady) {
            window.attachXtermInput();
        }</script>
    {{{ SCRIPT }}}
</body>
</html>
